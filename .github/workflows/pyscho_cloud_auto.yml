name: Pyscho Cloud Auto Poster

on:
  workflow_dispatch:   # manual run button
  schedule:
    - cron: "30 12 * * *"   # Daily 6:00 PM IST (12:30 UTC)

jobs:
  auto-post:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout Repository
      # -----------------------------
      - name: Checkout Repo
        uses: actions/checkout@v3

      # -----------------------------
      # Setup Python
      # -----------------------------
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # -----------------------------
      # Install Dependencies
      # -----------------------------
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytrends

      # -----------------------------
      # Run Automation Script
      # -----------------------------
      - name: Run Pyscho Automation
        env:
          PYSCHO_ACCESS_TOKEN: ${{ secrets.PYSCHO_ACCESS_TOKEN }}
          PYSCHO_FB_PAGE_ID: ${{ secrets.PYSCHO_FB_PAGE_ID }}
          PYSCHO_IG_BUSINESS_ID: ${{ secrets.PYSCHO_IG_BUSINESS_ID }}

          PYSCHO_CLOUDINARY_CLOUD_NAME: ${{ secrets.PYSCHO_CLOUDINARY_CLOUD_NAME }}
          PYSCHO_CLOUDINARY_API_KEY: ${{ secrets.PYSCHO_CLOUDINARY_API_KEY }}
          PYSCHO_CLOUDINARY_API_SECRET: ${{ secrets.PYSCHO_CLOUDINARY_API_SECRET }}

        run: |
          python pyscho_cloud_auto.py
