name: Auto Upload Shorts (YouTube + Facebook)

on:
  schedule:
    - cron: "30 1 * * *"    # 7:00 AM IST (UTC 1:30)
    - cron: "30 11 * * *"   # 5:00 PM IST (UTC 11:30)
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ==============================
      # CHECKOUT REPO
      # ==============================
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==============================
      # SETUP PYTHON
      # ==============================
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # ==============================
      # INSTALL DEPENDENCIES
      # ==============================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==============================
      # RUN AUTO UPLOAD SCRIPT
      # ==============================
      - name: Run Geeta Daily Auto Upload
        run: python Geeta_Daily_FB_YT.py
        env:
          FOLDER_ID: ${{ secrets.FOLDER_ID }}
          UPLOADED_FOLDER_ID: ${{ secrets.UPLOADED_FOLDER_ID }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          VIDEOS_PER_RUN: 4

      # ==============================
      # COMMIT UPDATED EPISODE FILE
      # ==============================
      - name: Commit updated episode number
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add episode.txt
          git commit -m "Auto upload completed" || echo "No changes to commit"
          git push
